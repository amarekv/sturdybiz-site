# Every value the page links to or names lives here, once. index.html reads
# them as {{ site.<name> }}; GitHub Pages builds the page with Jekyll on push.

title: SturdyBiz
tagline: From first call to final invoice.
description: >-
  SturdyBiz answers your phone, books the job on your real calendar, quotes it,
  invoices it and tracks your crew's hours, built for home-services trades.

# Where "Try it free" goes: self sign-up in the application. Creates a Free
# company after the person confirms their email.
# The site has no "Sign in": each company signs in at its own address.
trial_url: https://app.sturdybiz.com/signup

# The plans side by side, and the Terms of Service: both pages of the
# application, built from the same rules the app enforces, so nothing about a
# plan is restated on this site.
plans_url: https://app.sturdybiz.com/plans
terms_url: https://app.sturdybiz.com/terms

# Where demo requests and questions go. A mailbox on
# Namecheap Private Email.
contact_email: contact@sturdybiz.com

# The contact form posts to SturdyBiz's own web-form intake, as a customer's
# website would: each message becomes a customer in the SturdyBiz company in
# the app, and the addresses set under Tenant Admin > Web Form Integration are
# emailed. The key is generated on that screen (header key, not URL). It is
# meant to sit in a public page -- it can only file an enquiry -- and is
# revoked there if abused. Empty: the form is not shown, only the email link.
enquiry_url: https://app.sturdybiz.com/api/enquiries
enquiry_key: ""

# The canonical address of this site (www redirects here; see CNAME).
url: https://sturdybiz.com

legal_name: SturdyBiz
copyright_year: 2026

# Jekyll would otherwise publish these.
exclude:
  - README.md
  - SECURITY.md
