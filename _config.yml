# Every value the page links to or names lives here, once. index.html reads
# them as {{ site.<name> }}; GitHub Pages builds the page with Jekyll on push.

title: SturdyBiz
tagline: From first call to final invoice.
description: >-
  SturdyBiz answers your phone, books the job on your real calendar, quotes it,
  invoices it and tracks your crew's hours, built for home-services trades.

# Where "Try it free" goes: self sign-up in the application. Creates a Free
# company after the person confirms their email.
# The site has no "Sign in": each company signs in at its own address.
trial_url: https://app.sturdybiz.com/signup

# Where demo requests and questions go. A mailbox on
# Namecheap Private Email.
contact_email: contact@sturdybiz.com

# The canonical address of this site (www redirects here; see CNAME).
url: https://sturdybiz.com

legal_name: SturdyBiz
copyright_year: 2026

# Jekyll would otherwise publish these.
exclude:
  - README.md
  - SECURITY.md
